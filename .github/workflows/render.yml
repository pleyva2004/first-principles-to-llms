name: Render

on:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '**.ipynb'
      - '.github/workflows/render.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-chain-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compile chain.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: chain.tex
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Commit chain.pdf
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f chain.pdf
          if git diff --cached --quiet; then
            echo "No changes to chain.pdf"
          else
            git commit -m "ci: render chain.pdf [skip ci]"
            git push origin HEAD:main
          fi

  render-chain-html:
    runs-on: ubuntu-latest
    needs: render-chain-pdf
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest (PDF job may have just pushed)
        run: git pull --rebase origin main

      - name: Install jupyter + nbconvert
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y python3-pip
          pip3 install --break-system-packages jupyter nbconvert

      - name: Convert chain.ipynb to HTML
        run: jupyter nbconvert --to html chain.ipynb

      - name: Commit chain.html
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f chain.html
          if git diff --cached --quiet; then
            echo "No changes to chain.html"
          else
            git commit -m "ci: render chain.html [skip ci]"
            git push origin HEAD:main
          fi
